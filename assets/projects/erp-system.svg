<svg xmlns="http://www.w3.org/2000/svg" width="356" height="168" viewBox="0 0 356 168" role="img" aria-label="erp-system — Spring Boot ERP — modules, roles, clean REST backend.">
  <defs>
    <linearGradient id="erp-systembg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1428"/><stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="erp-systemaccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="erp-systemglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="356" height="168" rx="16" fill="url(#erp-systembg)" stroke="#1b2740"/>
  <rect width="356" height="168" rx="16" fill="url(#erp-systemglow)"/>
  <rect x="16" y="16" width="300" height="2" rx="1" fill="url(#erp-systemaccent)" opacity="0.85">
    <animate attributeName="width" values="60;300;60" dur="6s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(30 62)">
    <circle r="24" fill="none" stroke="#233150" stroke-width="1.6" stroke-dasharray="8 6" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="17" fill="#0d1428"/>
    <text x="0" y="7" text-anchor="middle" font-size="19">🏭</text>
    <circle r="26" fill="url(#erp-systemaccent)" opacity="0.2">
      <animate attributeName="r" values="24;30;24" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.06;0.25" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="72" y="40" font-family="'Segoe UI','SF Pro Display',Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff">erp-system</text>
  <text x="72" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" letter-spacing="1.5" fill="#e76f00">JAVA</text>
  <text x="30" y="102" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#aebfd9">Spring Boot ERP — modules, roles, clean REST backend.</text>
  <g transform="translate(303 20)" opacity="0.95">
