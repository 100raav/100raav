<svg xmlns="http://www.w3.org/2000/svg" width="640" height="150" viewBox="0 0 640 150" role="img" aria-label="Education — Noida International University, Computer Science &amp; Engineering">
  <defs>
    <linearGradient id="edubg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1428"/><stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="eduaccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="150" rx="16" fill="url(#edubg)" stroke="#1b2740"/>

  <rect x="18" y="18" width="604" height="2" rx="1" fill="url(#eduaccent)" opacity="0.9">
    <animate attributeName="width" values="80;604;80" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(34 78)">
    <circle r="26" fill="none" stroke="#233150" stroke-width="1.6" stroke-dasharray="8 6" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="19" fill="#0d1428"/>
    <text x="0" y="6.5" text-anchor="middle" font-size="18">🎓</text>
  </g>

  <text x="74" y="48" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" letter-spacing="3" fill="#67e8f9">EDUCATION</text>
  <text x="74" y="72" font-family="'Segoe UI','SF Pro Display',Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Noida International University</text>
  <text x="74" y="94" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#aebfd9">Bachelor of Technology · Computer Science &amp; Engineering</text>
  <text x="74" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8ea3c9">Greater Noida · Delhi NCR, India</text>

  <g transform="translate(548 66)">
    <rect x="-2" y="-2" width="82" height="24" rx="12" fill="#0a0f1e" stroke="#1b2740"/>
    <circle cx="14" cy="10" r="4" fill="#22ee6a"><animate attributeName="fill-opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="26" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff">IN PROGRESS</text>
  </g>

  <circle cx="612" cy="120" r="4" fill="#f472b6">
    <animate attributeName="cx" values="34;612;34" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>